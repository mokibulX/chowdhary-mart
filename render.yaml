services:
  - type: web
    name: chowdharymart-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run render:build
    startCommand: pnpm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://chowdharymart-web.onrender.com,https://chowdhary-mart.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: APP_TEST_MODE
        value: false
      - key: ALLOW_DEMO_OTP
        value: false

  - type: web
    name: chowdharymart-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run render:web:build
    staticPublishPath: artifacts/web/dist/public
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://chowdharymart-api.onrender.com
      - key: VITE_PUBLIC_API_URL
        value: https://chowdharymart-api.onrender.com
      - key: VITE_WEBSOCKET_URL
        value: wss://chowdharymart-api.onrender.com
      - key: VITE_PUBLIC_WEBSOCKET_URL
        value: wss://chowdharymart-api.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_APP_TEST_MODE
        value: false
      - key: VITE_ALLOW_DEMO_OTP
        value: false
      - key: VITE_SHOW_DEMO_BADGE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
